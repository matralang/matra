name: Verify bundled distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  distribution:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-24.04
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
          - os: windows-2025
            target: win32-x64
          - os: windows-11-arm
            target: win32-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
      - name: Verify native target
        env:
          MATRA_EXPECTED_TARGET: ${{ matrix.target }}
        run: node -e "require('node:assert/strict').equal(process.platform + '-' + process.arch, process.env.MATRA_EXPECTED_TARGET)"
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Build compiler and HTML renderer
        run: pnpm --filter @matra/core run build && pnpm --filter @matra/html run build
      - name: Verify CLI contracts
        run: pnpm --filter @matra/cli run test
      - name: Build and verify native folder and extracted ZIP
        run: pnpm distribution:build
      - name: Upload verified development archive
        uses: actions/upload-artifact@v7
        with:
          name: matra-${{ matrix.target }}
          path: |
            dist/releases/*.zip
            dist/releases/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
